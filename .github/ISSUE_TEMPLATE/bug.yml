name: Bug report
description: Report a reproducible problem in a Boson Science project.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the project. Do not include secrets, private data, or vulnerability details in this form.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Identify the affected release, commit, or deployment.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant operating system, runtime, browser, hardware, or deployment details.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence that demonstrates the problem.
      placeholder: |
        1. Configure ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include relevant logs or screenshots after removing sensitive information.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Initial checks
      options:
        - label: I searched existing open and closed issues.
          required: true
        - label: This report does not disclose a security vulnerability or private information.
          required: true
